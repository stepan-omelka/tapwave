services:
  - type: web
    name: tapwave
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    # Liveness only: unlike /actuator/health it doesn't query the database, so Neon can sleep.
    healthCheckPath: /actuator/health/liveness
    envVars:
      # Neon's direct (unpooled) connection string, postgresql://user:password@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
