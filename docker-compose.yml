services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tapwave
      POSTGRES_USER: tapwave
      POSTGRES_PASSWORD: tapwave
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - tapwave-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tapwave -d tapwave"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tapwave-db:
